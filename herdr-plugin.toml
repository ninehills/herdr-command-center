id = "herdr-command-center"
name = "Herdr Command Center"
version = "0.4.1"
min_herdr_version = "0.7.0"
description = "Stream workspace and agent telemetry to your own endpoint"
platforms = ["linux", "macos"]

[[build]]
# fetches a prebuilt release binary (no Go toolchain required) and falls
# back to `go build` for local dev / unreleased platforms
command = ["sh", "scripts/fetch-or-build.sh"]

# the daemon is a singleton — every hook is a cheap no-op when it's alive
[[events]]
on = "workspace.created"
command = ["bin/herdr-command-center", "ensure-daemon"]

[[events]]
on = "pane.created"
command = ["bin/herdr-command-center", "ensure-daemon"]

[[events]]
on = "worktree.created"
command = ["bin/herdr-command-center", "ensure-daemon"]

[[actions]]
id = "start"
title = "Command Center: start daemon"
command = ["bin/herdr-command-center", "ensure-daemon"]

[[actions]]
id = "status"
title = "Command Center: status"
command = ["bin/herdr-command-center", "status"]

[[actions]]
id = "flush"
title = "Command Center: flush now"
command = ["bin/herdr-command-center", "flush"]

[[actions]]
id = "test-endpoint"
title = "Command Center: send test event"
command = ["bin/herdr-command-center", "test"]

[[actions]]
id = "check-update"
title = "Command Center: check for updates"
command = ["bin/herdr-command-center", "check-update"]

[[actions]]
id = "stop"
title = "Command Center: stop daemon"
command = ["bin/herdr-command-center", "stop"]
